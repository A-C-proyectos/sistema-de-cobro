<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · Pescadería del Mar POS</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content">
        <div class="page-header">
          <div>
            <h1>Clientes</h1>
            <p>Directorio de clientes y su historial de compras</p>
          </div>
          <button class="btn btn-accent" id="btn-nuevo-cliente">+ Nuevo cliente</button>
        </div>

        <div class="toolbar">
          <div class="search-box" style="min-width:280px;">
            <span class="icon">🔍</span>
            <input type="text" id="buscar" class="input" placeholder="Buscar por nombre o teléfono...">
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="no-sort">Nombre</th>
                  <th class="no-sort">Teléfono</th>
                  <th class="no-sort">Correo</th>
                  <th class="no-sort">Dirección</th>
                  <th class="no-sort">Registrado</th>
                  <th class="no-sort"></th>
                </tr>
              </thead>
              <tbody id="tabla-clientes"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal cliente -->
  <div class="modal-overlay" id="modal-cliente">
    <div class="modal">
      <form id="form-cliente">
        <div class="modal__header">
          <h3 id="titulo-modal-cliente">Nuevo cliente</h3>
          <button type="button" class="modal__close" data-cerrar-modal>✕</button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label for="campo-nombre">Nombre completo *</label>
            <input type="text" id="campo-nombre" class="input" placeholder="Ej. María Rodríguez">
            <span class="field-error" id="error-nombre"></span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="campo-telefono">Teléfono</label>
              <input type="text" id="campo-telefono" class="input" placeholder="809-555-0000">
              <span class="field-error" id="error-telefono"></span>
            </div>
            <div class="form-group">
              <label for="campo-correo">Correo</label>
              <input type="email" id="campo-correo" class="input" placeholder="correo@ejemplo.com">
              <span class="field-error" id="error-correo"></span>
            </div>
          </div>
          <div class="form-group">
            <label for="campo-direccion">Dirección</label>
            <input type="text" id="campo-direccion" class="input" placeholder="Calle, número, sector">
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn-outline" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-accent">Guardar cliente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal historial -->
  <div class="modal-overlay" id="modal-historial">
    <div class="modal modal--lg">
      <div class="modal__header">
        <h3 id="titulo-historial">Historial de compras</h3>
        <button type="button" class="modal__close" data-cerrar-modal>✕</button>
      </div>
      <div class="modal__body" id="contenido-historial"></div>
      <div class="modal__footer">
        <button type="button" class="btn btn-outline" data-cerrar-modal>Cerrar</button>
      </div>
    </div>
  </div>

  <div id="modales-slot"></div>

  <script type="module" src="../js/clientes/clientes.js"></script>
</body>
</html>
