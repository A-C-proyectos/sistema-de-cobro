<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta · Sistema POS</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/pos.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot-pages"></div>

    <div class="main">
      <div id="topbar-slot"></div>

      <div class="content">
        <div class="pos-layout">
          <!-- Catálogo -->
          <section class="pos-catalog">
            <div class="pos-catalog__filters">
              <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" id="buscar-producto" class="input" placeholder="Buscar producto por nombre o SKU...">
              </div>
              <div class="chip-group" id="filtro-categorias"></div>
            </div>
            <div class="pos-grid" id="pos-grid"></div>
          </section>

          <!-- Carrito -->
          <aside class="pos-cart">
            <div class="pos-cart__header">
              <h3>🛒 Carrito (<span id="carrito-contador">0</span>)</h3>
              <button class="btn btn-ghost btn-sm" id="btn-vaciar-carrito">Vaciar</button>
            </div>
            <div class="pos-cart__client">
              <span>Cliente:</span>
              <select id="select-cliente" class="input"></select>
            </div>
            <div class="pos-cart__items scrollbar-thin" id="lista-carrito"></div>
            <div class="pos-cart__discount">
              <input type="number" id="input-descuento" class="input" placeholder="Descuento (RD$)" min="0" step="1">
            </div>
            <div class="pos-cart__totals">
              <div class="totals-row"><span>Subtotal</span><span class="amount" id="total-subtotal">RD$0.00</span></div>
              <div class="totals-row"><span>Descuento</span><span class="amount" id="total-descuento">RD$0.00</span></div>
              <div class="totals-row"><span>Impuestos</span><span class="amount" id="total-impuesto">RD$0.00</span></div>
              <div class="totals-row total"><span>TOTAL</span><span class="amount" id="total-final">RD$0.00</span></div>
            </div>
            <div class="pos-cart__actions">
              <button class="btn btn-accent btn-block btn-lg" id="btn-cobrar">💳 COBRAR</button>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de checkout -->
  <div class="modal-overlay" id="modal-checkout">
    <div class="modal">
      <div class="modal__header">
        <h3>Cobrar venta</h3>
        <button class="modal__close" data-cerrar-modal>✕</button>
      </div>
      <div class="modal__body">
        <div class="checkout-total">
          <div class="checkout-total__label">Total a pagar</div>
          <div class="checkout-total__value" id="checkout-total-valor">RD$0.00</div>
        </div>

        <div class="form-group">
          <label>Método de pago</label>
          <div class="payment-methods">
            <button type="button" class="payment-method is-selected" data-metodo="efectivo"><span class="icon">💵</span><span>Efectivo</span></button>
            <button type="button" class="payment-method" data-metodo="tarjeta"><span class="icon">💳</span><span>Tarjeta</span></button>
            <button type="button" class="payment-method" data-metodo="transferencia"><span class="icon">🏦</span><span>Transferencia</span></button>
            <button type="button" class="payment-method" data-metodo="pago_movil"><span class="icon">📱</span><span>Pago móvil</span></button>
          </div>
        </div>

        <div id="bloque-efectivo">
          <div class="form-group">
            <label for="input-efectivo-recibido">Efectivo recibido</label>
            <input type="number" id="input-efectivo-recibido" class="input" placeholder="0.00" min="0" step="1">
          </div>
          <div class="change-display hidden" id="checkout-cambio">
            <span>Cambio</span><span>RD$0.00</span>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn-outline" data-cerrar-modal>Cancelar</button>
        <button class="btn btn-accent" id="btn-confirmar-pago">Confirmar pago</button>
      </div>
    </div>
  </div>

  <!-- Modal de recibo -->
  <div class="modal-overlay" id="modal-recibo">
    <div class="modal">
      <div class="modal__header">
        <h3>Comprobante de venta</h3>
        <button class="modal__close" data-cerrar-modal>✕</button>
      </div>
      <div class="modal__body">
        <div class="receipt" id="recibo-contenido"></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn-outline" id="btn-descargar-recibo">💾 Descargar factura</button>
        <button class="btn btn-outline" id="btn-imprimir-recibo">🖨️ Imprimir</button>
        <button class="btn btn-primary" id="btn-nueva-venta" data-cerrar-modal>Nueva venta</button>
        <button class="btn btn-ghost" data-cerrar-modal>Cerrar</button>
      </div>
    </div>
  </div>

  <div id="modales-slot"></div>

  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/components/layout.js"></script>
  <script src="../js/components/modales.js"></script>
  <script src="../js/pos/carrito.js"></script>
  <script src="../js/pos/checkout.js"></script>
  <script src="../js/pos/pos.js"></script>
</body>
</html>
