<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores · Sistema POS</title>
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content">
        <div class="page-header">
          <div>
            <h1>Proveedores</h1>
            <p>Empresas y contactos que suministran mercancía</p>
          </div>
          <button class="btn btn-accent" id="btn-nuevo-proveedor">+ Nuevo proveedor</button>
        </div>

        <div class="toolbar">
          <div class="search-box" style="min-width:280px;">
            <span class="icon">🔍</span>
            <input type="text" id="buscar" class="input" placeholder="Buscar por empresa o contacto...">
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="no-sort">Empresa</th>
                  <th class="no-sort">Contacto</th>
                  <th class="no-sort">Teléfono</th>
                  <th class="no-sort">Correo</th>
                  <th class="no-sort">Productos</th>
                  <th class="no-sort"></th>
                </tr>
              </thead>
              <tbody id="tabla-proveedores"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal proveedor -->
  <div class="modal-overlay" id="modal-proveedor">
    <div class="modal">
      <form id="form-proveedor">
        <div class="modal__header">
          <h3 id="titulo-modal-proveedor">Nuevo proveedor</h3>
          <button type="button" class="modal__close" data-cerrar-modal>✕</button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label for="campo-empresa">Nombre de la empresa *</label>
            <input type="text" id="campo-empresa" class="input" placeholder="Ej. Mariscos del Caribe SRL">
            <span class="field-error" id="error-empresa"></span>
          </div>
          <div class="form-group">
            <label for="campo-contacto">Nombre de contacto *</label>
            <input type="text" id="campo-contacto" class="input" placeholder="Ej. Juan Peña">
            <span class="field-error" id="error-contacto"></span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="campo-telefono">Teléfono</label>
              <input type="text" id="campo-telefono" class="input" placeholder="809-555-0000">
              <span class="field-error" id="error-telefono"></span>
            </div>
            <div class="form-group">
              <label for="campo-correo">Correo</label>
              <input type="email" id="campo-correo" class="input" placeholder="correo@empresa.com">
              <span class="field-error" id="error-correo"></span>
            </div>
          </div>
          <div class="form-group">
            <label for="campo-direccion">Dirección</label>
            <input type="text" id="campo-direccion" class="input" placeholder="Dirección de la empresa">
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn-outline" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-accent">Guardar proveedor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal productos del proveedor -->
  <div class="modal-overlay" id="modal-productos-proveedor">
    <div class="modal modal--lg">
      <div class="modal__header">
        <h3 id="titulo-productos-proveedor">Productos del proveedor</h3>
        <button type="button" class="modal__close" data-cerrar-modal>✕</button>
      </div>
      <div class="modal__body" id="contenido-productos-proveedor"></div>
      <div class="modal__footer">
        <button type="button" class="btn btn-outline" data-cerrar-modal>Cerrar</button>
      </div>
    </div>
  </div>

  <div id="modales-slot"></div>

  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/components/layout.js"></script>
  <script src="../js/components/modales.js"></script>
  <script src="../js/proveedores/proveedores.js"></script>
</body>
</html>
