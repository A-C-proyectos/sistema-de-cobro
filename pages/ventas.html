<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas · Pescadería del Mar POS</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/pos.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content">
        <div class="page-header">
          <div>
            <h1>Historial de ventas</h1>
            <p>Consulta, filtra e imprime comprobantes de ventas realizadas</p>
          </div>
          <a href="pos.html" class="btn btn-accent">🧾 Nueva venta</a>
        </div>

        <div class="toolbar">
          <div class="search-box" style="min-width:240px;">
            <span class="icon">🔍</span>
            <input type="text" id="buscar" class="input" placeholder="Buscar por # de venta o cliente...">
          </div>
          <select id="filtro-metodo" class="input" style="max-width:200px;">
            <option value="todos">Todos los métodos</option>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="transferencia">Transferencia</option>
            <option value="pago_movil">Pago móvil</option>
          </select>
          <input type="date" id="filtro-fecha" class="input" style="max-width:180px;">
          <button class="btn btn-ghost btn-sm" id="btn-limpiar-filtros">Limpiar filtros</button>
          <div class="toolbar__spacer"></div>
          <span class="text-muted" id="resumen-filtrado" style="font-size: var(--fs-sm);"></span>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="no-sort">ID</th>
                  <th class="no-sort">Fecha</th>
                  <th class="no-sort">Hora</th>
                  <th class="no-sort">Cliente</th>
                  <th class="no-sort">Productos</th>
                  <th class="no-sort">Método</th>
                  <th class="no-sort">Total</th>
                  <th class="no-sort">Estado</th>
                  <th class="no-sort"></th>
                </tr>
              </thead>
              <tbody id="tabla-ventas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal detalle de venta -->
  <div class="modal-overlay" id="modal-detalle-venta">
    <div class="modal">
      <div class="modal__header">
        <h3>Detalle de venta</h3>
        <button type="button" class="modal__close" data-cerrar-modal>✕</button>
      </div>
      <div class="modal__body">
        <div class="receipt" id="recibo-contenido"></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn-outline" id="btn-imprimir-detalle">🖨️ Imprimir</button>
        <button class="btn btn-ghost" data-cerrar-modal>Cerrar</button>
      </div>
    </div>
  </div>

  <div id="modales-slot"></div>

  <script type="module" src="../js/ventas/ventas.js"></script>
</body>
</html>
